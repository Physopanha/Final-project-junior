<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopanova Contact Us Web Page</title>
    <link rel="stylesheet" href="./contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
     <header class="header">
        <div class="logo">
            <h1>SAPONOVA</h1>
        </div>
        <div class="links">
            <ul class="links-ls">
                <li><a href="index.html">HOME</a></li>
                <li><a href="Shop.html">SHOP</a></li>
                <li><a href="Blog.html">BLOG</a></li>
                <li><a href="about_us.html">ABOUT US</a></li>
                <li><a href="contact_us.html">CONTACT US</a></li>
            </ul>
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">
            <section class="contact-info">
                <h1>Get in Touch</h1>
                <div class="support-section">
                    <div class="support">
                        <h2>Customer Support</h2>
                        <div class="support-details">
                            <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
                            <div>
                                <p class="label">Call Us:</p>
                                <p class="value"> (+855) 16621026 </p>
                            </div>
                        </div>
                        <div class="support-items">
                            <div class="icon-box"><i class="fa-solid fa-envelope"></i></div>
                            <div>
                                <p class="label">Email:</p>
                                <p class="value">support@saponova.com</p>
                            </div>
                        </div>
                    </div>
                    <div class="avatar-container">
                        <img src="https://static.vecteezy.com/system/resources/previews/077/887/065/non_2x/simple-flat-style-customer-support-avatar-profile-communication-icon-vector.jpg" alt="Support Agent" width="100px" height="100px" class="avatar-icon">
                    </div>
                </div>

                <div class="social-section">
                    <h2>Follow Us on Instagram</h2>
                    <div class="social-pills">
                        <a href="" class="social-pill">
                            <i class="fa-brands fa-instagram"></i>
                            <span>@Saponova</span>
                        </a>
                        <a href="" class="social-pill">
                            <i class="fa-brands fa-instagram"></i>
                            <span>@Saponova_Official</span>
                        </a>
                        <a href="" class="social-pill">
                            <i class="fa-brands fa-snapchat"></i>
                            <span>@Saponova_Team</span>
                        </a>
                    </div>
                </div>
            </section>

            <section class="contact-form-card">
                <h2>Send Us a Message</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Help</a>
        </div>
        <div class="footer-socials">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
    </footer>
</body>
</html>
