<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Strawberry Iced Matcha Card</title>
    <link rel="stylesheet" href="stylematcha.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="card-container">
        <div class="header">
            <i class="fa-solid fa-arrow-left icon-btn"></i>
            <span class="category-title">Cold Drinks</span>
            <i class="fa-regular fa-heart icon-btn"></i>
        </div>

        <div class="product-display">
            <i class="fa-solid fa-chevron-left nav-arrow"></i>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVjPrpV90uWVRy7rQNVhJMHiakSa9tZ1m5d37MZ48uXr4lfcdhvQENwLw&s=10" alt="Strawberry Iced Matcha" class="product-img">
            <i class="fa-solid fa-chevron-right nav-arrow"></i>
        </div>

        <div class="product-info">
            <h1 class="product-name">Strawberry Iced Matcha</h1>
            <p class="product-description">
                Iced matcha latte topped with blended strawberry cream made from organic strawberries. Hints of fruity, sweet, and tangy notes and full of green tea flavor.
            </p>
            <div class="wave-line">
                <svg viewBox="0 0 120 28">
                    <path d="M0,15 C15,30 15,0 30,15 C45,30 45,0 60,15 C75,30 75,0 90,15 C105,30 105,0 120,15" fill="none" stroke="#e8989e" stroke-width="2"></path>
                </svg>
            </div>
        </div>

        <div class="options-container">
            <h2 class="section-title">Milk</h2>
            
            <div class="milk-grid">
                <button class="milk-btn active">Oat</button>
                <button class="milk-btn">Soy</button>
                <button class="milk-btn">Cream</button>
                <button class="milk-btn">Coconut</button>
                <button class="milk-btn">Almond</button>
                <button class="milk-btn">No Milk</button>
            </div>

            <div class="dots-container">
                <span class="dot active-dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="quantity-selector">
                <span class="circle-icon">-</span>
                <span class="qty-number">1</span>
                <span class="circle-icon">+</span>
            </div>

            <button class="add-to-cart-btn">Add to cart</button>
        </div>
    </div>

</body>
</html>
