<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make a Payment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="payment.css">
</head>
<body>

<div class="container12">
    
    <div class="payment-banner">
        <div class="payment-info">
            <div class="icon-circle">
                <i class="fas fa-wallet"></i>
            </div>
            <div class="text-content">
                <h2>Make a Payment</h2>
                <p>Choose your preferred payment method to complete your tuition and fees.</p>
            </div>
        </div>
        <div class="payment-graphics">
            <img src="13421997.webp" alt="" class="card-img">
        </div>
    </div>

    <h3>Payment option</h3>

    <div class="background-cad">
        <div class="icon-circle1">
            <img src="16778982.png" alt="" class="Debite-card">
        </div>
        <div class="font4">
            <h4>Credit/ Debit Card</h4>
            <a href="credit/payment.html">visa, Mastercard, JCB</a>
        </div>
        <div class="arrow-icon">
            <img src="pngtree-vector-arrows-arrow-icon-arrow-vector-icon-arrow-png-image_4294132.png" alt="" style="width: 22px; height: 22px;">
        </div>
    </div>

    <div class="background-cad1">
        <div class="icon-circle1-1">
            <img src="QR.png" alt="" class="Debite-card1">
        </div>
        <div class="font4-1">
            <h4>QR payment</h4>
            <a href="credit/QR.html">Scan and pay</a>
        </div>
        <div class="arrow-icon1">
            <img src="pngtree-vector-arrows-arrow-icon-arrow-vector-icon-arrow-png-image_4294132.png" alt="" style="width: 22px; height: 22px;">
        </div>
    </div>

    <div class="background-cad2">
        <div class="icon-circle1-2">
            <img src="1052854.png" alt="" class="Debite-card2">
        </div>
        <div class="font4-2">
            <h4>Bank Transfer</h4>
            <a href="credit/Bank-transfer.html">use your bank account</a>
        </div>
        <div class="arrow-icon2">
            <img src="pngtree-vector-arrows-arrow-icon-arrow-vector-icon-arrow-png-image_4294132.png" alt="" style="width: 22px; height: 22px;">
        </div>
    </div>

    <div class="background-cad3">
        <div class="icon-circle1-3">
            <img src="iconephone.png" alt="" class="Debite-card3">
        </div>
        <div class="font4-3">
            <h4>Mobile wallet</h4>
            <a href="Mobile-wallet.html">ABA Wing pi pay,etc</a>
        </div>
        <div class="arrow-icon3">
            <img src="pngtree-vector-arrows-arrow-icon-arrow-vector-icon-arrow-png-image_4294132.png" alt="" style="width: 22px; height: 22px;">
        </div>
    </div>

</div>

<script src="payment.js"></script>

</body>
</html>
