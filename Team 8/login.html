<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-container">
    
    <div class="header-banner">
        <div class="icon">
            <i class="fa-solid fa-user"></i>
        </div>
    <span class="badge">IT STUDENT PORTAL</span>
    <h2>Welcome Back!</h2>
    <p>Log in to access your courses & opportunities</p>
    </div>
    <form class="form-container">
        <div class="input-group">
        <label for="student-id">Student ID / Email</label>
        <input type="text" id="student-id" placeholder="Enter your ID or Email" required>
        </div>

        <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-actions">
        <label class="remember-me">
            <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">
        <a href="home (2).html">Log in</button></a>

        <div class="footer-text">
        Don't have an account? <a href="#">Register</a>
        </div>
</form>
</div>

</body>
</html>
