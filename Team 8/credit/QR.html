<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Payment</title>

    <!-- QR CSS -->
    <link rel="stylesheet" href="QR.css">
</head>

<body>
    <section class="payment-banner">
        <div class="payment-info">
            <div class="icon-circle">
                <img src="images.png" alt="">
            </div>
            <div class="text-content">
                <h2>QR Payment</h2>
                <p>
                    Scan the QR code with your banking app to
                    complete payment
                </p>
            </div>
        </div>
        <div class="payment-graphics">
            <div class="card-img">
                <img src="images.png" alt="QR">
            </div>
        </div>
    </section>
    <section class="qr-card">

        <h1>Scan QR Code</h1>
        <div class="qr-box">
            <img src="photo_2026-09-23_19-42-44.jpg" alt="QR Payment">
        </div>
        <div class="instruction">
            <div class="phone-icon">
                📱
            </div>
            <div class="instruction-text">
                <h3>Open your banking app</h3>
                <p>
                    Scan the QR code above to make the payment.
                </p>
            </div>
        </div>
    </section>
</body>
</html>
