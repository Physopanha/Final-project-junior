<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devcyber-club | Contact & Join</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
  <span class="logo-bracket">&lt;</span><span class="logo-text-white">Dev</span><span class="logo-text-cyber">Cyber</span><span class="logo-bracket">&nbsp;/&gt;</span>
</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-item">Home</a></li>
        <li><a href="events.html" class="nav-item">Events</a></li>
        <li><a href="about.html" class="nav-item">About</a></li>
        <li><a href="projects.html" class="nav-item">Projects</a></li>
        <li><a href="resources.html" class="nav-item">Resources</a></li>
        <li><a href="contact.html" class="nav-item active">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <h1 class="page-title">Join Devcyber-club</h1>
      <p class="page-description">Get in touch or become a registered member of our tech club.</p>
    </section>

    <section class="section-container">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
          </div>
          <div class="form-group">
            <label for="email">Student Email</label>
            <input type="email" id="email" class="form-control" placeholder="student@university.edu" required>
          </div>
          <div class="form-group">
            <label for="interest">Primary Area of Interest</label>
            <select id="interest" class="form-control">
              <option>Web Security</option>
              <option>Reverse Engineering</option>
              <option>Network Defense</option>
              <option>Software Development</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message / Questions</label>
            <textarea id="message" class="form-control" rows="4" placeholder="Tell us about yourself..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">&copy; 2026 Devcyber-club. All rights reserved.</footer>
</body>
</html>
